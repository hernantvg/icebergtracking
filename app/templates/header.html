<!-- header.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iceberg Sentinel: Professional Polar Tracking System. View real-time iceberg coordinates, historical trajectories, and surface area decay metrics.">
    <meta name="keywords" content="iceberg, tracker, real-time tracking, USNIC, climate change, polar, Antarctic, satellite data, GIS mapping">
    <meta name="author" content="Iceberg Sentinel Team">
    <meta property="og:title" content="Iceberg Sentinel - Real-Time Polar Tracking & Analysis">
    <meta property="og:description" content="High-fidelity interactive tracking dashboard for Antarctic icebergs. Access live coordinates, historical trajectory charts, and mass decay timelines.">
    <meta property="og:image" content="/static/og-image.jpg">
    <meta name="robots" content="index, follow">
    
    <title>Iceberg Sentinel - Real-Time Polar Tracking</title>

    <!-- Favicon -->
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Leaflet.js Mapping Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Chart.js Animations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="mb-4">
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="/">
                    <i class="fa-solid fa-icicles text-cyan me-2 fs-4" style="color: var(--accent-cyan);"></i>
                    <h1>Iceberg Sentinel</h1>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link nav-link-custom {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="fa-solid fa-chart-line me-1"></i> Dashboard
                        </a>
                        <a class="nav-link nav-link-custom {% if request.path == '/tracking' %}active{% endif %}" href="/tracking">
                            <i class="fa-solid fa-map-location-dot me-1"></i> Tracking
                        </a>
                        <a class="nav-link nav-link-custom {% if request.path == '/about' %}active{% endif %}" href="/about">
                            <i class="fa-solid fa-circle-info me-1"></i> Quadrants Guide
                        </a>
                        {% if session.admin_logged_in %}
                        <a class="nav-link nav-link-custom {% if request.path == '/sync' %}active{% endif %}" href="/sync" style="border: 1px solid rgba(0, 245, 212, 0.3);">
                            <i class="fa-solid fa-rotate me-1 text-cyan" style="color: var(--accent-cyan);"></i> Admin Control
                        </a>
                        <a class="nav-link nav-link-custom text-danger" href="/logout">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                        </a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </nav>
    </header>
