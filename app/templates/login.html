{% include 'header.html' %}

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <!-- Glassmorphic Login panel -->
            <div class="glass-panel glow-cyan py-5 px-4 text-center">
                <!-- Branding logo -->
                <div class="mb-4">
                    <div class="d-inline-block p-3 rounded-circle bg-dark bg-opacity-40 border border-light border-opacity-10 mb-3">
                        <i class="fa-solid fa-shield-halved fa-3x text-cyan" style="color: var(--accent-cyan); text-shadow: 0 0 15px rgba(0, 245, 212, 0.4);"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Administrative Access</h3>
                    <p class="text-secondary small mb-0">Authorized Sentinel Officers Only. Enter key to decrypt controls.</p>
                </div>

                <!-- Error Indicator banner -->
                {% if error %}
                <div class="alert alert-danger bg-danger bg-opacity-10 border border-danger border-opacity-20 text-danger small py-2 px-3 rounded mb-4" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i>{{ error }}
                </div>
                {% endif %}

                <!-- Credential submit form -->
                <form method="POST" action="">
                    <div class="mb-4 text-start">
                        <label for="password" class="form-label text-secondary small uppercase fw-bold mb-2">Sentinel Key</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-light border-opacity-10 text-secondary"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control" name="password" id="password" placeholder="••••••••••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-custom w-100 py-3">
                        <i class="fa-solid fa-unlock-keyhole me-2"></i>Authenticate Key
                    </button>
                </form>

                <!-- Navigation link fallback -->
                <div class="mt-4">
                    <a href="/" class="small text-secondary text-decoration-none hover-cyan" style="transition: var(--transition-smooth);"><i class="fa-solid fa-arrow-left me-1"></i> Return to Public Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
