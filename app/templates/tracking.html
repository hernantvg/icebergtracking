<!DOCTYPE html>
<html lang="en">

<body>
    {% include 'header.html' %}
    <div class="container mt-4">
        <header>
            <h1>Iceberg Tracker</h1>
            <p class="lead">Track icebergs in real-time, view their trajectory, and access up-to-date data.</p>
        </header>

        {% if message %}
        <div class="alert alert-warning" role="alert">{{ message }}</div>
        {% endif %}

        <form method="POST" action="/select" class="my-4">
            <div class="row mb-4">
                <div class="col-md-8">
                    <label for="iceberg" class="form-label">Select Iceberg</label>
                    <select class="form-select" name="iceberg" id="iceberg" required>
                        <option value="" disabled selected>Select an iceberg</option>
                        {% for iceberg in icebergs %}
                        <option value="{{ iceberg }}">{{ iceberg }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Show Trajectory</button>
                </div>
            </div>
        </form>

        {% if iceberg_map %}
        <section id="map">
            <h5 class="text-center">Iceberg Trajectory Map</h5>
            <div class="map-container">
                {{ iceberg_map|safe }}
            </div>
        </section>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
